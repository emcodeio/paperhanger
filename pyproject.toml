[project]
name = "paperhanger"
version = "0.1.0"
description = "Turn a folder of images into desktop and phone wallpapers on macOS"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
paperhanger = "paperhanger.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_upscaler: requires upscayl-bin installed (Tier 3); deselected by default",
    "corpus: requires ~/Pictures/wallpaper (Tier 2); deselected by default",
]
# Tier 1 alone, so that a bare `uv run pytest` IS the per-commit gate rather
# than a command that quietly costs eight minutes. Tier 2 gates pushes, not
# commits -- the spec has always said so and this is where the code agrees.
#
# A `-m` on the command line REPLACES this expression; it does not AND with
# it. So `-m "not corpus"` puts tier 3 back and `-m corpus` puts tier 2 back
# WITHOUT tier 3 -- which is the intent in both cases, but only because both
# tiers are named here. README's Testing section spells out the command for
# each tier for the same reason; this trap has already cost this project once.
addopts = "-m 'not corpus and not real_upscaler'"
